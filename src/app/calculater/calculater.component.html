<h1 style="text-align: center;">Calculater</h1>
<div class="container">
    <input type="text"  [(ngModel)]="num1" class="result" readonly/>
    <div>
      <button (click)="show('1')" class="btn">1</button>
      <button (click)="show('2')" class="btn">2</button>
      <button (click)="clear()" class="btn">clear</button>
      <button (click)="show('3')" class="btn">3</button>
      <button (click)="show('4')" class="btn">4</button>
      <button (click)="operation('/')" class="btn">/</button>
      <button (click)="show('5')" class="btn">5</button>
      <button (click)="show('6')" class="btn">6</button>
      <button (click)="operation('*')" class="btn">*</button>
      <button (click)="show('7')" class="btn">7</button>
  
      <button (click)="show('8')" class="btn">8</button>
      <button (click)="operation('+')" class="btn">+</button>
      <button (click)="show('9')" class="btn">9</button>
  
      <button (click)="show('0')" class="btn">0</button>
      <button (click)="operation('-')" class="btn">-</button>
      <button (click)="calculate()" class="equal">=</button>
    </div>
  </div>
