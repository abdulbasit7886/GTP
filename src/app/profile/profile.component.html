<div *ngIf="notificationMessage" class="notification">
  <p>{{ notificationMessage }}</p>
  <button (click)="clearNotification()">Close</button>
</div>

<div class="main">
  <div *ngIf="userData" class="maindiv">
    <div>
      <div class="postform">
        <form #userpost="ngForm" (ngSubmit)="createpost()">
          <input
            type="text"
            placeholder="Enter post title"
            [(ngModel)]="title"
            name="title"
            required
            class="post_input"
          />
          <br />
          <textarea
            placeholder="Enter description"
            [(ngModel)]="description"
            name="description"
            required
            class="textarea"
          >
          </textarea>

          <input
            type="file"
            (change)="onimageSelect($event)"
            class="file_input"
          />
          <br />

          <div *ngIf="err_msg" class="error_msg">
            {{ err_msg }}
          </div>

          <button type="submit" class="add_post_but">
            {{ isEdit ? "Edit Post" : "Add Post" }}
          </button>
        </form>
      </div>
      <div *ngIf="posts.length > 0; else noPosts">
        <div *ngFor="let post of posts; let i = index" class="post_div">
          <strong class="username">{{ post.username }}</strong>

          <div class="user_posts">
            <p class="posttitle">{{ post.title }}</p>
            <p class="postdes">
              {{ post.description }}
            </p>

            <img
              *ngIf="post.image"
              [src]="'http://localhost:3000/' + post.image"
              alt="Post Image"
              class="post-image"
            />
            <br />
            <button (click)="EditPost(i)" class="update_butt">Edit</button>
            <button (click)="deletePost(i)" class="delete_butt">Delete</button>
          </div>
        </div>
      </div>

      <ng-template #noPosts>
        <p class="er_msg">No posts available.</p>
      </ng-template>
    </div>
  </div>

  <div *ngIf="user">
    <p>{{ user.username }}</p>
  </div>
</div>
