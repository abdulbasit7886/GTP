<div class="navbar">
    <div class="logo"></div>
    <nav>
      <ul>
        <li><i class="fa-solid fa-user"></i><a routerLink="/dashboard" routerLinkActive="active-link">Dashboard</a></li>
        <li><i class="fa-solid fa-gear"></i><a routerLink="/userinfo" routerLinkActive="active-link">Settings</a></li>
      </ul>
    </nav>
    <button (click)="logout()" class="logout-button">
      <i class="fa-solid fa-right-from-bracket"></i>Logout
    </button>
  </div>
<div class="search-container">
    <div class="search-bar">
      <input type="text" [(ngModel)]="searchQuery" (keyup)="searchUsers()"   placeholder="Search" />
      <button (click)="searchUsers()">Search</button>
    </div>
  </div>
  
  <!-- Result container outside of the search container -->
  <div class="search-results-container">
    <div *ngIf="searchResults.length">
      <ul>
        <li *ngFor="let user of searchResults">
          <p>{{ user.name }}</p><br>
            <p>{{ user.email }}</p>
                <button (click)="sendFriendRequest(user)">Add Friend</button>
          </li>
          
      </ul>
      
    </div>
    <div *ngIf="searchResults.length === 0">
      <p>No users to show.</p>
    </div>
    
  </div>
