<div *ngIf="message" class="alert alert-danger">
  {{ message }}
</div>

<div *ngIf="tasks.length > 0; else noTasks">
  <ul>
    <li *ngFor="let task of tasks">
      <h3>{{ task.title }}</h3>
      <p>{{ task.description }}</p>
      <p><strong>Assigned To:</strong> {{ task.userId }}</p> 
    </li>
  </ul>
</div>

<ng-template #noTasks>
  <p>No tasks found.</p>
</ng-template>
