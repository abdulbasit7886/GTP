<div class="dashboard-container">
  <header>
    <h1>Welcome to the Dashboard</h1>
    <div class="header-buttons">
      <button [routerLink]="['/createpost']" class="create-post-button">Create Post</button>
      <button [routerLink]="['/userinfo']" class="user-update-button">Update User</button>
      <button (click)="logout()" class="logout-button">Logout</button>
    </div>
  </header>

  <div class="post-list">
    <div *ngFor="let post of posts" class="post-item">
      <h3>{{ post.title }}</h3>
      <p>{{ post.content }}</p>
      <div class="post-actions">
        <button class="like-button">Like</button>
        <button class="comment button">Comment</button><button (click)="editpage(post._id)" class="edit-post-button">Edit Post</button>
        <button (click)="deletePost(post._id)" class="delete-post-button">Delete Post</button>
      </div>
      
    </div>
  </div>
</div>
