<div class="container">
    <button class="btn" (click)="createTask()">create task</button>
    <table class="table">
        <thead>
            <tr>
                <th>Title</th>
                <th>Description</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr *ngFor="let task of tasks" [id]="task._id">
                <td>{{task.taskName}}</td>
                <td> {{task.taskDescription}} </td>
                <td>
                    <button class="btn btn-primary" >Edit</button>
                    <button class="btn btn-danger" (click)="deleteTask(task._id)">Delete</button>
                </td>
            </tr>
            <tr id="table-row"></tr>
        </tbody>
    </table>
</div>
