<div class="view">
  <h2>Welcome to the Dashboard</h2>
  <button [routerLink]="['/createpost']" class="create-post-button">Create Post</button>

  <div *ngFor="let post of posts">
    <h3>{{ post.title }}</h3>
    <p>{{ post.content }}</p>
    <button [routerLink]="['/editpost', post.id]" class="edit-post-button">Edit Post</button>
  </div>
</div>
