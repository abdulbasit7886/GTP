<div class="main">
  <div class="signup-container">
    <h2>Signup</h2>
    <form (ngSubmit)="onSignup()" [formGroup]="signupForm" class="signup-form">
      
      <!-- Name Field -->
      <div class="form-group">
        <label for="name">Name:</label>
        <input
          formControlName="name"
          type="text"
          id="name"
          placeholder="Enter your name"
          [class.invalid]="signupForm.get('name')?.invalid && signupForm.get('name')?.touched"
        />
        <div *ngIf="signupForm.get('name')?.invalid && signupForm.get('name')?.touched" class="error">
          Name is required and must be at least 3 characters long.
        </div>
      </div>
      
      <!-- Email Field -->
      <div class="form-group">
        <label for="email">Email:</label>
        <input
          formControlName="email"
          type="email"
          id="email"
          placeholder="Enter your email"
          [class.invalid]="signupForm.get('email')?.invalid && signupForm.get('email')?.touched"
        />
        <div *ngIf="signupForm.get('email')?.invalid && signupForm.get('email')?.touched" class="error">
          Please enter a valid email address.
        </div>
      </div>

      <!-- Password Field -->
      <div class="form-group">
        <label for="password">Password:</label>
        <input
          formControlName="password"
          type="password"
          id="password"
          placeholder="Enter your password"
          [class.invalid]="signupForm.get('password')?.invalid && signupForm.get('password')?.touched"
        />
        <div *ngIf="signupForm.get('password')?.invalid && signupForm.get('password')?.touched" class="error">
          Password is required and must be at least 6 characters long.
        </div>
      </div>
      
      <!-- Gender Field -->
      <div class="form-group">
        <label for="gender">Gender:</label>
        <select formControlName="gender" id="gender">
          <option value="male">Male</option>
          <option value="female">Female</option>
          <option value="other">Other</option>
        </select>
      </div>

          <!-- Link to signup page -->
      <div class="signup-link">
        <p>Already have an account? <a routerLink="/auth/login">Login</a></p>
      </div>
      
      <!-- Submit Button -->
      <button type="submit" [disabled]="signupForm.invalid">Signup</button>
    </form>
  </div>
</div>
