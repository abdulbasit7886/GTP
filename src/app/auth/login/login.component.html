<div class="main">
    <div class="form-container">
      <h2>Login</h2>
      <form (ngSubmit)="login()">
        <input type="email" [(ngModel)]="email" name="email" id="loginEmail" placeholder="Email" required>
        <input type="password" [(ngModel)]="password" name="password" id="loginPassword" placeholder="Password" minlength="6" required>
        <button type="submit">Login</button>
      </form>
      <p class="small-text">Don't have an account? <a routerLink="signup" class="link">Sign Up</a></p>
    </div>
  </div>
