<!-- src/app/authentication/login/login.component.html -->
<h2>Login</h2>
<form (ngSubmit)="login()">
  <label>Email:</label>
  <input [(ngModel)]="loginData.email" name="email" type="email" required />
  <label>Password:</label>
  <input [(ngModel)]="loginData.password" name="password" type="password" required />
  <button type="submit">Login</button>
</form>
