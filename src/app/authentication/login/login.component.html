<h2>Login</h2>
<form (ngSubmit)="login()">
  <label>Email:</label>
  <input [(ngModel)]="loginData.email" name="email" type="email" required />
  <label>Password:</label>
  <input [(ngModel)]="loginData.password" name="password" type="password" required />
  <button type="submit">Login</button>
  <p>Don't have an account <a routerLink="/signup">click here</a></p>
</form>
