<app-header></app-header>

<div class="flex flex-col w-[60%] m-auto mt-6 gap-6">
    <ul class="flex flex-col gap-5 md:flex-row cursor-pointer" *ngFor="let post of posts.allPosts" [routerLink]="['/post-details', post._id]">
        <li class="h-48 w-48 relative flex-shrink-0">
            <img [src]="post.imgBaseUrl+post.cover" alt="Img" fill class="aspect-square object-cover"/>
        </li>
        <li class="flex flex-col">
            <div class="font-extrabold text-3xl">{{post.title | slice:0:50}}</div>
            <div class="flex-grow">{{post.content | slice: 0:200}}</div>
            <small class="font-semibold">{{post.author.username}}</small>
            <small class="font-light">{{post.createdAt | date: 'medium'}}</small>
        </li>
    </ul>
</div>
